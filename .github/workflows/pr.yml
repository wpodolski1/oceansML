name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.11 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_LOCKED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv with cache
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install native wheel runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libexpat1 zlib1g libstdc++6

      - name: Sync locked development environment
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run basedpyright

      - name: Test
        run: uv run pytest
