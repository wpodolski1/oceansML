[project]
name = "oceansml"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "netcdf4",
  "dask[distributed]",
  "scipy",
  "scikit-learn",
  "torch",
  "typing-extensions",
  "geopandas",
  "rasterio",
  "shapely",
  "matplotlib",
  "plotly",
  "python-dotenv",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-geopandas>=1.2.0.20261107,<1.3",
    "types-shapely>=2.2.0.20261117,<2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "recommended"
